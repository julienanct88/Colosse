  function loadScript(urls,check,name){
    return new Promise(function(resolve,reject){
      var i=0;
      function tryNext(){
        if(i>=urls.length){reject(new Error(name+' failed'));return}
        var s=document.createElement('script');s.crossOrigin='anonymous';s.src=urls[i];
        s.onload=function(){if(check()){resolve()}else{i++;tryNext()}};
        s.onerror=function(){i++;tryNext()};
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

/* ═══ WAKE LOCK ═══ */
function useWakeLock(on){
  const wl=useRef(null);const vid=useRef(null);
  useEffect(()=>{
    if(!on)return;let ok=true;
    if("wakeLock"in navigator){
      const req=async()=>{try{wl.current=await navigator.wakeLock.request("screen");wl.current.addEventListener("release",()=>{if(ok)req()})}catch(e){}};
      req();const vis=()=>{if(document.visibilityState==="visible"&&ok)req()};
      document.addEventListener("visibilitychange",vis);
      return()=>{ok=false;document.removeEventListener("visibilitychange",vis);if(wl.current)wl.current.release().catch(()=>{})};
    }
    try{
      var v=document.createElement("video");v.setAttribute("playsinline","");v.setAttribute("muted","");v.muted=true;v.setAttribute("loop","");
      v.style.cssText="position:fixed;top:-1px;left:-1px;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1";
      v.src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAFxtZGF0AAAAMGWIhAAV//73ye/Apuv5LYQAM8KJMo/5FhkTwQ0GHjBhAHvgAAAPaGliZXJ0AAAADmRhdGEAAAAA5wAAAAAbsp+AEcARwE+ACcBvgFEAAAAOZGF0YQAAAADGAAAA";
      document.body.appendChild(v);var pa=function(){v.play().catch(function(){})};pa();
      document.addEventListener("touchstart",pa,{once:true});document.addEventListener("click",pa,{once:true});
      vid.current=v;return()=>{ok=false;if(vid.current){vid.current.pause();vid.current.remove();vid.current=null}};
    }catch(e){}
  },[on]);
}

function localDayNumber(date){return Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/(24*60*60*1000))}
function appWeekIndexForDate(date){return Math.floor((localDayNumber(date)-localDayNumber(new Date(2026,1,2)))/7)}
function profileProgramWeek(profile){
  var start=profile&&profile.startDate?new Date(profile.startDate):profile&&profile.createdAt?new Date(profile.createdAt):new Date(),now=new Date();
  var n=Math.floor((localDayNumber(now)-localDayNumber(start))/7)+1;
  return Math.max(1,n);
}
function selectedProfileWeek(profile,wN){
  var selectedMonday=new Date(2026,1,2+(wN-1)*7),start=profile&&profile.startDate?new Date(profile.startDate):profile&&profile.createdAt?new Date(profile.createdAt):new Date();
  var startDow=start.getDay(),toMonday=startDow===0?-6:1-startDow;
  start.setHours(0,0,0,0);start.setDate(start.getDate()+toMonday);
  return Math.max(1,Math.floor((localDayNumber(selectedMonday)-localDayNumber(start))/7)+1);

function adaptExerciseVolume(ex,profile,index){
  var n=adaptExerciseConstraints(ex,profile),duration=parseInt(profile.duration)||45;

  if(restart)n.sets=Math.min(n.sets,index<2?3:2);
  else if(profile.level==="beginner")n.sets=Math.min(n.sets,3);
  if(duration<=30)n.sets=Math.min(n.sets,index<2?3:2);
  if(profile.goal==="muscle"&&profile.level==="intermediate"&&duration>=60&&index<2)n.sets=Math.max(n.sets,3);

   PPL : Lun=0..Sam=5. U/L : Lun=0, Mar=1, Jeu=2, Ven=3.
   R5 : Lun=0, Mar=1, Mer=2, Jeu=3, Ven=4 (week-end → Ven affiché). */
function dowToDayI(wN, dow, profile){
  if(profile&&profile.programKey!=="julien"){
    var n=parseInt(profile.days)||3;
    var map3={1:0,2:0,3:1,4:1,5:2,6:2,0:0};
    var map4={1:0,2:1,3:1,4:2,5:3,6:3,0:0};
    var map5={1:0,2:1,3:2,4:3,5:4,6:4,0:0};
    var m=n<=3?map3:n===4?map4:map5;
    return m[dow]!==undefined?m[dow]:0;
  }
  if(wN>=23){
    var r5Map={1:0, 2:1, 3:2, 4:3, 5:4, 6:4, 0:0};
    return r5Map[dow]!==undefined ? r5Map[dow] : 0;
  }
  if(wN>=14){
    /* Mapping U/L : sauts mer/sam/dim */
    var ulMap={1:0, 2:1, 3:1, 4:2, 5:3, 6:3, 0:0};
    return ulMap[dow]!==undefined ? ulMap[dow] : 0;
  }
  return (dow>=1 && dow<=6) ? dow-1 : 0;
}
function isExactTrainingDay(wN,dayI,dow,profile){
  var scheduled;
  if(profile&&profile.programKey!=="julien"){
    var n=parseInt(profile.days)||3;
    scheduled=n<=3?[1,3,5]:n===4?[1,2,4,5]:[1,2,3,4,5];
  }else scheduled=wN>=23?[1,2,3,4,5]:wN>=14?[1,2,4,5]:[1,2,3,4,5,6];
  return scheduled[dayI]===dow;
}

function findPrevForVariant(exId,dayKey,wkNum,allWks,variant){
  for(var pw=wkNum-1;pw>=1;pw--){
    var wd=allWks[pw];if(!wd||!wd.ds||!wd.ds[dayKey]||!wd.ds[dayKey][exId])continue;
    var exData=wd.ds[dayKey][exId];
    var hasDone=exData.s&&exData.s.some(function(s){return s.d&&s.w&&parseFloat(s.w)>0});
    if(!hasDone)continue;
    if(variant){if(exData.variant===variant)return exData}
    else{return exData}
  }
  return null;
}

function getLatestVTaper(allWks,upToWkNum){
  for(var w=upToWkNum;w>=1;w--){
    var wd=allWks[w];if(!wd||!wd.ms)continue;
    var ep=parseFloat(wd.ms.epaules||""),ta=parseFloat(wd.ms.taille||"");
    if(ep>0&&ta>0){var r=(ep/ta).toFixed(2);return{ratio:r,num:parseFloat(r),week:w,ep:ep,ta:ta}}
  }
  return null;
}

function getWeekSessionCount(wkData,wN,profile){
  if(!wkData||!wkData.ds)return 0;var done=0;
  /* Si wN fourni, n'utiliser que les jours du programme actif. Sinon, scanner tous les jours. */
  var daysToScan = (typeof wN==="number") ? getDaysForProfile(profile,wN) : ALL_DAYS;
  daysToScan.forEach(function(d){var dd=wkData.ds[d.key];if(!dd)return;var any=false,all=true;

    if(any&&all)done++});
  return done;
}

function waitForCloudLibrary(){return new Promise(function(resolve,reject){
  if(window.supabase&&window.supabase.createClient){resolve();return}
  var waited=0,t=setInterval(function(){waited+=100;if(window.supabase&&window.supabase.createClient){clearInterval(t);resolve()}else if(waited>=8000){clearInterval(t);reject(new Error("Le service de challenge ne répond pas."))}},100);
})}
async function getCloudConnection(){
  if(!cloudConfigured())throw new Error("Le partage des challenges n’est pas encore configuré.");
  if(cloudConnectionPromise)return cloudConnectionPromise;
  cloudConnectionPromise=(async function(){
    await waitForCloudLibrary();var cfg=cloudConfig();
    var client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    var sr=await client.auth.getSession();if(sr.error)throw sr.error;
    var session=sr.data&&sr.data.session;
    if(!session){var ar=await client.auth.signInAnonymously();if(ar.error)throw ar.error;session=ar.data.session}
    if(!session||!session.user)throw new Error("Impossible de créer ton accès anonyme.");
    return{client:client,userId:session.user.id};
  })().catch(function(err){cloudConnectionPromise=null;throw err});
  return cloudConnectionPromise;
}

    DAYS.forEach(function(day){

      var tgt=4;day.exs.forEach(function(e){if(e.id===eid)tgt=e.sets});
      while(sets.length<tgt)sets.push({w:"",r:"",d:false});

    });
  });

function migrateData(st){
  if(!st||!st.wk)return st;var changed=false;
  if(!st.migV2){
    var mwk=["pushA","pullA","legsA"];
    function dhd(ds,dk){if(!ds||!ds[dk])return false;var f=false;Object.keys(ds[dk]).forEach(function(eid){var ex=ds[dk][eid];if(ex&&ex.s)ex.s.forEach(function(s){if(s.d&&s.w&&parseFloat(s.w)>0)f=true})});return f}
    for(var n=11;n>=1;n--){var src=st.wk[n];if(!src||!src.ds)continue;if(!st.wk[n+1])st.wk[n+1]=emptyW();var dst=st.wk[n+1];if(!dst.ds)dst.ds={};
      mwk.forEach(function(dk){if(!dhd(src.ds,dk))return;if(dhd(dst.ds,dk))return;dst.ds[dk]=JSON.parse(JSON.stringify(src.ds[dk]));var dd=DAYS.find(function(d){return d.key===dk});if(dd){src.ds[dk]={};dd.exs.forEach(function(ex){src.ds[dk][ex.id]={s:mkS(ex.sets),tw:"",tr:""}})}changed=true})}
    st.migV2=true;changed=true;
  }
  if(!st.migV3){
    // Décalage epoch 26 jan → 2 fév : ancien wk[N+1] → nouveau wk[N]
    var old1=st.wk[1]?JSON.parse(JSON.stringify(st.wk[1])):null;
    for(var n=1;n<=11;n++){st.wk[n]=st.wk[n+1]?JSON.parse(JSON.stringify(st.wk[n+1])):emptyW()}
    st.wk[12]=emptyW();
    // Fusionner ancien wk[1] (pushB/pullB/legsB) dans nouveau wk[1]
    if(old1&&old1.ds&&st.wk[1]&&st.wk[1].ds){
      ["pushB","pullB","legsB"].forEach(function(dk){
        if(!old1.ds[dk])return;
        var hd=false;Object.keys(old1.ds[dk]).forEach(function(eid){var ex=old1.ds[dk][eid];if(ex&&ex.s)ex.s.forEach(function(s){if(s.d&&s.w&&parseFloat(s.w)>0)hd=true})});
        if(!hd)return;
        var nhd=false;if(st.wk[1].ds[dk])Object.keys(st.wk[1].ds[dk]).forEach(function(eid){var ex=st.wk[1].ds[dk][eid];if(ex&&ex.s)ex.s.forEach(function(s){if(s.d&&s.w&&parseFloat(s.w)>0)nhd=true})});
        if(!nhd)st.wk[1].ds[dk]=JSON.parse(JSON.stringify(old1.ds[dk]));
      });
    }
    st.migV3=true;changed=true;
  }
  Object.keys(st.wk).forEach(function(wn){
    var wd=st.wk[wn];if(!wd||!wd.ds)return;
    /* Migration : on initialise tous les jours possibles (PPL + U/L) sur toutes les semaines. */
    ALL_DAYS.forEach(function(day){
      if(!wd.ds[day.key])wd.ds[day.key]={};
      day.exs.forEach(function(ex){
        if(!wd.ds[day.key][ex.id]){wd.ds[day.key][ex.id]={s:mkS(ex.sets),tw:"",tr:""};changed=true}
        var cur=wd.ds[day.key][ex.id];
        if(cur.s.length<ex.sets){while(cur.s.length<ex.sets)cur.s.push({w:"",r:"",d:false});changed=true}
      });
    });
    if(!wd.ms){wd.ms={};MEAS.forEach(function(m){wd.ms[m.id]=""});changed=true}
    else{MEAS.forEach(function(m){if(typeof wd.ms[m.id]==="undefined"){wd.ms[m.id]="";changed=true}})}
    if(typeof wd.nt==="undefined"){wd.nt="";changed=true}
    if(typeof wd.mood==="undefined"){wd.mood="";changed=true}
  });
  if(!st.ord){st.ord={};ALL_DAYS.forEach(function(d){st.ord[d.key]=d.exs.map(function(e){return e.id})});changed=true}
  else{ALL_DAYS.forEach(function(d){if(!st.ord[d.key])st.ord[d.key]=d.exs.map(function(e){return e.id});else{d.exs.forEach(function(e){if(st.ord[d.key].indexOf(e.id)===-1){st.ord[d.key].push(e.id);changed=true}})}})}
  if(!st.hb){st.hb={};changed=true}
  if(changed)save(st);return st;
}

/* ═══ PROGRESSION DOUBLE — RÉFÉRENCE = DERNIÈRE SÉRIE ═══ */
function compObj(exDef,prev,rng,tpOverride){
  if(!prev||!rng)return null;
  var dn=prev.s.filter(function(s){return s.d&&s.w&&parseFloat(s.w)>0});
  if(!dn.length)return null;
  var last=dn[dn.length-1],lW=parseFloat(last.w)||0,lR=parseInt(last.r)||0;
  if(!lW)return null;
  var inc=INC[tpOverride||exDef.tp]||2.5;
  if(lR>=rng.hi)return{w:String(lW+inc),r:String(rng.lo)};
  return{w:String(lW),r:String(Math.min(lR+1,rng.hi))};
}

/* ═══ PR ALL-TIME ═══ */
function getAllTimeBest(exId,allWks,currentWkNum){
  var best=0;
  for(var i=1;i<currentWkNum;i++){
    var wd=allWks[i];if(!wd||!wd.ds)continue;
    Object.keys(wd.ds).forEach(function(dayKey){
      if(!wd.ds[dayKey]||!wd.ds[dayKey][exId])return;
      var d=wd.ds[dayKey][exId];
      if(d.s)d.s.forEach(function(s){if(s.d){var w=parseFloat(s.w||0);if(w>best)best=w}});
    });
  }
  return best;
}

}

function getOrderedExs(dayDef,order){
  if(!order)return dayDef.exs;
  var locked=dayDef.exs.filter(function(e){return e.lk});
  var free=dayDef.exs.filter(function(e){return!e.lk});
  var fo=order.filter(function(id){return free.some(function(e){return e.id===id})});
  free.forEach(function(e){if(fo.indexOf(e.id)===-1)fo.push(e.id)});
  return locked.concat(fo.map(function(id){return free.find(function(e){return e.id===id})}).filter(Boolean));
}

function Timer({sec,c,onEnd,onSkip,onDC}){
  const[rem,setRem]=useState(sec);const[pau,setPau]=useState(false);
  const tot=useRef(sec);const au=useRef(null);const endRef=useRef(null);const onEndRef=useRef(onEnd);

  useEffect(function(){
    if(pau)return;
    if(rem<=0){
      try{if(!au.current)au.current=new(window.AudioContext||window.webkitAudioContext)();var x=au.current;[[0,660],[.15,880],[.3,1100]].forEach(function(pair){var o=x.createOscillator(),g=x.createGain();o.connect(g);g.connect(x.destination);o.frequency.value=pair[1];g.gain.setValueAtTime(.25,x.currentTime+pair[0]);g.gain.exponentialRampToValueAtTime(.001,x.currentTime+pair[0]+.2);o.start(x.currentTime+pair[0]);o.stop(x.currentTime+pair[0]+.25)})}catch(e){}
      try{navigator.vibrate&&navigator.vibrate([100,50,100,50,200])}catch(e){}
      onEndRef.current();return;
    }
    var t=setInterval(function(){var left=Math.round((endRef.current-Date.now())/1000);if(left<0)left=0;setRem(left)},250);
    return function(){clearInterval(t)};
  },[rem<=0,pau]);
  const pPau=useRef(false);
  useEffect(function(){if(pPau.current&&!pau)endRef.current=Date.now()+rem*1000;pPau.current=pau},[pau]);
  var R=46,ci=2*Math.PI*R,of=ci*(1-(tot.current>0?rem/tot.current:0));
  var m=Math.floor(rem/60),s=rem%60,lo=rem<=5&&rem>0;
  return<div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",padding:"14px 16px 30px",background:"rgba(8,8,15,.97)",backdropFilter:"blur(20px)",borderTop:"1px solid "+c+"30",animation:"slideUp .25s ease-out"}}>

      </div>
    </div>
    <div style={{display:"flex",gap:4,marginBottom:10}}>
      {REST_P.map(function(p){return<button key={p} onClick={function(){setRem(p);tot.current=p;endRef.current=Date.now()+p*1000;if(onDC)onDC(p)}} style={{padding:"4px 10px",borderRadius:8,border:tot.current===p?"1px solid "+c+"80":"1px solid rgba(255,255,255,.07)",background:tot.current===p?c+"22":"rgba(255,255,255,.03)",color:tot.current===p?c:"rgba(255,255,255,.3)",fontSize:10,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",cursor:"pointer"}}>{Math.floor(p/60)}:{(p%60).toString().padStart(2,"0")}</button>})}
    </div>

      <button onClick={function(){setPau(function(p){return!p})}} style={{padding:"8px 24px",borderRadius:10,border:"1px solid rgba(255,255,255,.12)",background:"rgba(255,255,255,.07)",color:"#fff",fontSize:12,fontWeight:800,cursor:"pointer"}}>{pau?"▶ Go":"⏸ Pause"}</button>

    </div>
  </div>;
}

/* ═══ WEEK CAROUSEL ═══ */
function WeekCarousel({phases,wk,setWk,st,setRd,setSt,profile}){
  const ref=useRef(null);
  const startX=useRef(0);const startY=useRef(0);const swiping=useRef(false);
  const[offX,setOffX]=useState(0);const[anim,setAnim]=useState(true);

  useEffect(function(){
    var el=ref.current;if(!el)return;
    function ts(e){startX.current=e.touches[0].clientX;startY.current=e.touches[0].clientY;swiping.current=false;setAnim(false)}
    function tm(e){
      var dx=e.touches[0].clientX-startX.current;
      var dy=e.touches[0].clientY-startY.current;
      if(!swiping.current&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8){swiping.current=true}
      if(swiping.current){e.preventDefault();setOffX(dx*0.4)}
    }
    function te(e){
      var dx=e.changedTouches[0].clientX-startX.current;
      setAnim(true);setOffX(0);
      if(Math.abs(dx)>50){
        var nw=dx<0?Math.min(wk+1,phases.length-1):Math.max(wk-1,0);
        setWk(nw);setRd(getPhaseRest(phases[nw].p));
        setSt(function(p){var n=JSON.parse(JSON.stringify(p));n.cw=nw+1;return n});
      }
      swiping.current=false;
    }
    el.addEventListener("touchstart",ts,{passive:true});
    el.addEventListener("touchmove",tm,{passive:false});
    el.addEventListener("touchend",te,{passive:true});
    return function(){el.removeEventListener("touchstart",ts);el.removeEventListener("touchmove",tm);el.removeEventListener("touchend",te)};
  },[wk,phases.length]);

  var ph=phases[wk],wN=wk+1,beta=profile&&profile.programKey!=="julien";
  var pc=PCFG[ph.p]||PCFG["Hypertrophie"];
  var wd2=getWeekDates(wN);
  var wkData=st.wk[wN];
  var scMax=getDaysForProfile(profile,wN).length;
  var sc=wkData?getWeekSessionCount(wkData,wN,profile):0;
  var targetCal=profile&&profile.programKey!=="julien"&&profile.calTarget?profile.calTarget:(ph.cal||3800);
  var phaseDesc=beta
    ? profile.profileType+" · "+profile.days+" séances de "+profile.duration+" min"
    : pc.desc;
  var cardColor=beta?"#10B981":ph.c;
  var weekMark=beta?"S"+selectedProfileWeek(profile,wN):"S"+wN;
  var weekTitle=beta?"Parcours personnalisé":ph.p;
  var rangeText=beta?"2 reps en réserve · progression":pc.cLo+"-"+pc.cHi+" compo · "+pc.iLo+"-"+pc.iHi+" iso";
  var vt=getLatestVTaper(st.wk,wN);
  var vtColor=vt?(vt.num>=1.45?"#10B981":vt.num>=1.35?"#F59E0B":"#EF4444"):null;

  function go(dir){
    var nw=dir>0?Math.min(wk+1,phases.length-1):Math.max(wk-1,0);
    setWk(nw);setRd(getPhaseRest(phases[nw].p));
    setSt(function(p){var n=JSON.parse(JSON.stringify(p));n.cw=nw+1;return n});
  }

  return<div style={{marginBottom:12}}>
    <div ref={ref} style={{position:"relative",overflow:"hidden",borderRadius:16,cursor:"grab"}}>
      <div style={{transform:"translateX("+offX+"px)",transition:anim?"transform .3s ease":"none",
        background:"linear-gradient(135deg,"+cardColor+"18,"+cardColor+"08)",
        border:"1px solid "+cardColor+"30",borderRadius:16,padding:"16px 18px 14px"}}>

        {/* Row 1: Week + Phase + Calories */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:28,fontWeight:900,color:cardColor}}>{weekMark}</span>
            <div>
              <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>{weekTitle}</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,.3)"}}>{wd2[0]} → {wd2[5]}</div>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:800,color:cardColor}}>{targetCal}</div>
            <div style={{fontSize:8,color:"rgba(255,255,255,.25)"}}>kcal/jour</div>
          </div>
        </div>

        {/* Row 2: V-Taper + Sessions */}
        <div style={{display:"flex",gap:10,marginBottom:8}}>
          {vt&&<div style={{flex:1,padding:"6px 10px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.06)"}}>
            <div style={{fontSize:8,fontWeight:800,color:"rgba(255,255,255,.25)",letterSpacing:.5,marginBottom:3}}>🔱 V-TAPER</div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:900,color:vtColor}}>{vt.ratio}</span>
              <div style={{flex:1}}>
                <MBar v={vt.num} mx={1.6} c={vtColor} h={4}/>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:7,color:"rgba(255,255,255,.15)",marginTop:1}}>
                  <span>1.0</span><span style={{color:"rgba(16,185,129,.5)",fontWeight:700}}>1.45</span><span>1.6</span>
                </div>
              </div>
            </div>
          </div>}
          <div style={{flex:1,padding:"6px 10px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.06)"}}>
            <div style={{fontSize:8,fontWeight:800,color:"rgba(255,255,255,.25)",letterSpacing:.5,marginBottom:3}}>💪 SÉANCES</div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:900,color:sc>=scMax?"#10B981":"#fff"}}>{sc}<span style={{fontSize:11,color:"rgba(255,255,255,.25)",fontWeight:400}}>/{scMax}</span></span>
              <div style={{flex:1}}><MBar v={sc} mx={scMax} c={sc>=scMax?"#10B981":cardColor} h={4}/></div>
            </div>
          </div>
        </div>

        {/* Row 3: Description + Reps */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:10,color:"rgba(255,255,255,.35)",fontStyle:"italic",flex:1}}>{phaseDesc}</div>
          <span style={{fontSize:9,color:"rgba(255,255,255,.2)",flexShrink:0,marginLeft:8}}>{rangeText}</span>
        </div>

        {/* Arrows */}
        {wk>0&&<button onClick={function(){go(-1)}} style={{position:"absolute",left:4,top:"50%",transform:"translateY(-50%)",width:24,height:24,borderRadius:"50%",border:"none",background:"rgba(255,255,255,.08)",color:"rgba(255,255,255,.4)",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>◀</button>}
        {wk<phases.length-1&&<button onClick={function(){go(1)}} style={{position:"absolute",right:4,top:"50%",transform:"translateY(-50%)",width:24,height:24,borderRadius:"50%",border:"none",background:"rgba(255,255,255,.08)",color:"rgba(255,255,255,.4)",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>▶</button>}
      </div>
    </div>

    {/* Phase dots */}
    {!beta&&<div style={{display:"flex",gap:2,justifyContent:"center",marginTop:6,flexWrap:"wrap"}}>
      {phases.map(function(p,i){
        var act=i===wk;
        return<button key={i} onClick={function(){setWk(i);setRd(getPhaseRest(p.p));setSt(function(prev){var n=JSON.parse(JSON.stringify(prev));n.cw=i+1;return n})}}
          style={{width:act?14:6,height:6,borderRadius:3,border:"none",background:act?p.c:i<wk?p.c+"55":"rgba(255,255,255,.1)",cursor:"pointer",padding:0,transition:"all .2s"}}/>;
      })}
    </div>}
  </div>;
}

function ChallengeRun({challenge,onFinish,onCancel}){
  const[countdown,setCountdown]=useState(3),[active,setActive]=useState(false),[score,setScore]=useState(0),[remaining,setRemaining]=useState(challenge.kind==="reps60"?60:null);
  const startRef=useRef(0);
  useEffect(function(){var t=setInterval(function(){setCountdown(function(c){if(c<=1){clearInterval(t);setActive(true);startRef.current=Date.now();return 0}return c-1})},850);return function(){clearInterval(t)}},[]);
  useEffect(function(){if(!active)return;var t=setInterval(function(){
    var sec=Math.floor((Date.now()-startRef.current)/1000);
    if(challenge.kind==="time"){setScore(sec);if(sec>=challenge.max){clearInterval(t);onFinish(challenge.max)}}
    if(challenge.kind==="reps60"){var r=Math.max(60-sec,0);setRemaining(r);if(r<=0){clearInterval(t);setActive(false)}}
  },150);return function(){clearInterval(t)}},[active,challenge.id]);
  return<div style={{position:"fixed",inset:0,zIndex:12000,background:"radial-gradient(circle at 50% 30%,"+challenge.color+"25,#08080f 55%)",color:"#fff",fontFamily:"'DM Sans',sans-serif",display:"flex",flexDirection:"column",padding:"calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))",textAlign:"center"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><button onClick={onCancel} style={{width:40,height:40,borderRadius:12,border:"1px solid rgba(255,255,255,.08)",background:"rgba(255,255,255,.04)",color:"rgba(255,255,255,.55)",fontSize:16,cursor:"pointer"}}>✕</button><div style={{fontSize:9,fontWeight:900,letterSpacing:1.4,color:challenge.color}}>TENTATIVE OFFICIELLE</div><div style={{width:40}}/></div>
    <div style={{marginTop:35,fontSize:42}}>{challenge.icon}</div><div style={{fontSize:24,fontWeight:950,marginTop:8}}>{challenge.name}</div>
    {!active&&countdown>0?<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:110,fontWeight:950,color:challenge.color,animation:"pulse .85s infinite"}}>{countdown}</div></div>:<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      {challenge.kind==="time"?<><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:70,fontWeight:950,letterSpacing:-4}}>{scoreLabel(challenge,score)}</div><div style={{fontSize:10,color:"rgba(255,255,255,.3)",marginTop:7}}>Objectif initial · {scoreLabel(challenge,challenge.target)}</div></>:<><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:84,fontWeight:950,color:challenge.color}}>{score}</div><div style={{fontSize:12,color:"rgba(255,255,255,.35)"}}>répétitions propres{challenge.kind==="reps60"?" · "+remaining+" s restantes":""}</div><button disabled={!active} onClick={function(){setScore(function(s){return Math.min(s+1,challenge.max)})}} style={{width:170,height:170,borderRadius:"50%",border:"2px solid "+challenge.color,background:challenge.color+"1F",color:"#fff",fontSize:18,fontWeight:950,marginTop:25,cursor:active?"pointer":"default",boxShadow:"0 0 50px "+challenge.color+"25"}}>+ 1 REP</button></>}
    </div>}
    {countdown===0&&<div>{challenge.kind==="time"?<button onClick={function(){onFinish(score)}} style={{width:"100%",padding:"18px",borderRadius:16,border:"none",background:"#EF4444",color:"#fff",fontSize:15,fontWeight:950,cursor:"pointer"}}>J’arrête · enregistrer</button>:<button disabled={challenge.kind==="reps60"&&active} onClick={function(){onFinish(score)}} style={{width:"100%",padding:"18px",borderRadius:16,border:"none",background:challenge.kind==="reps60"&&active?"rgba(255,255,255,.08)":challenge.color,color:challenge.kind==="reps60"&&active?"rgba(255,255,255,.25)":"#fff",fontSize:15,fontWeight:950,cursor:"pointer"}}>{challenge.kind==="reps60"&&active?"Le chrono est en cours…":"Valider "+score+" répétitions"}</button>}<div style={{fontSize:8,color:"rgba(255,255,255,.22)",marginTop:10}}>Arrête immédiatement en cas de douleur ou de malaise.</div></div>}
  </div>;
}

/* ═══ ERROR BOUNDARY ═══ */
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null}}
  static getDerivedStateFromError(e){return{err:e}}
  render(){
    if(this.state.err){
      var self=this;
      return React.createElement("div",{style:{minHeight:"100vh",background:"#08080f",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,color:"#fff",textAlign:"center"}},
        React.createElement("div",{style:{fontSize:32,marginBottom:10}},"⚠️"),
        React.createElement("div",{style:{fontSize:14,fontWeight:800,marginBottom:6}},"Erreur"),
        React.createElement("div",{style:{fontSize:11,color:"rgba(255,255,255,.4)",marginBottom:16,maxWidth:260}},String(this.state.err)),
        React.createElement("button",{onClick:function(){self.setState({err:null})},style:{padding:"8px 20px",borderRadius:10,border:"1px solid #10B981",background:"rgba(16,185,129,.1)",color:"#10B981",fontSize:12,fontWeight:800,cursor:"pointer"}},"Réessayer")
      );
    }
    return this.props.children;
  }
}

        {REST_P.map(function(p){return<button key={p} onClick={function(){setRd(p)}} style={{padding:"3px 8px",borderRadius:6,border:rd===p?"1px solid "+day.color+"60":"1px solid rgba(255,255,255,.05)",background:rd===p?day.color+"15":"transparent",color:rd===p?day.color:"rgba(255,255,255,.2)",fontSize:9,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",cursor:"pointer"}}>{p>=60?Math.floor(p/60)+"m":""}:{(p%60).toString().padStart(2,"0")}</button>})}

        a.click();URL.revokeObjectURL(url);
      }} style={{flex:1,padding:"10px",borderRadius:12,border:"1px solid rgba(16,185,129,.25)",background:"rgba(16,185,129,.07)",color:"#10B981",fontSize:11,fontWeight:800,cursor:"pointer",textAlign:"center"}}>📥 Exporter</button>
      <button onClick={function(){
        var inp=document.createElement("input");inp.type="file";inp.accept=".json";
        inp.onchange=function(e){
          var f=e.target.files[0];if(!f)return;
          var reader=new FileReader();
          reader.onload=function(ev){
            try{
              var d=JSON.parse(ev.target.result);
              var training=d.training||d;
              if(!training.wk){alert("Fichier invalide");return}
              if(!confirm("Remplace toutes tes données. Continuer ?"))return;

              var cw=(training.cw||2)-1;if(cw<0)cw=0;if(cw>PHASES.length-1)cw=PHASES.length-1;setWk(cw);setRd(getPhaseRest(PHASES[cw].p));

<script>
if('serviceWorker'in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      setInterval(function(){reg.update()},30*60*1000);
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            var b=document.createElement('div');
            b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:linear-gradient(90deg,#10B981,#059669);color:#fff;text-align:center;padding:12px;font-family:DM Sans,sans-serif;font-size:13px;font-weight:800;cursor:pointer;';
            b.textContent='🔄 Mise à jour disponible — Toucher pour installer';
            b.onclick=function(){nw.postMessage({type:'SKIP_WAITING'});window.location.reload()};
            document.body.appendChild(b);
          }
        });
      });
    }).catch(function(e){console.log('SW:',e)});
  });
}
</script>
